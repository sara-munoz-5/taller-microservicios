services:
  cassandra:
    image: cassandra:4.0
    container_name: aeroreserva-cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: aeroreserva-cluster
      CASSANDRA_NUM_TOKENS: 16
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    ports:
      - "9042:9042"
    volumes:
      - aeroreserva_cassandra_4_data:/var/lib/cassandra
    networks:
      - aeroreserva-network
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES'"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  flight-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: flight-service
    container_name: aeroreserva-flight-service
    environment:
      RAILS_ENV: development
      CASSANDRA_HOST: cassandra
      GRPC_PORT: 50051
    ports:
      - "50051:50051"
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - aeroreserva-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: aeroreserva-web
    environment:
      FLIGHT_SERVICE_URL: flight-service:50051
    ports:
      - "4321:4321"
    depends_on:
      flight-service:
        condition: service_started
    networks:
      - aeroreserva-network

volumes:
  aeroreserva_cassandra_4_data:

networks:
  aeroreserva-network:
    driver: bridge